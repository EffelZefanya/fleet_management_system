services:
  postgres:
    image: postgres:16-alpine
    container_name: armada_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: armada_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: armada_rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  vehicle_tracker_api:
    build:
      context: .
      dockerfile: Dockerfile.vehicle_tracker_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/armada_db?sslmode=disable
    depends_on:
      - postgres
    restart: on-failure

  mqtt_sub:
    build:
      context: .
      dockerfile: Dockerfile.mqtt_sub
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/armada_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MQTT_BROKER_URL=tcp://mqtt:1883
    depends_on:
      - postgres
      - mqtt
      - rabbitmq
    restart: on-failure

  geofence_worker:
    build:
      context: .
      dockerfile: Dockerfile.geofence_worker
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    restart: on-failure

  mqtt_pub:
    build:
      context: .
      dockerfile: Dockerfile.mqtt_pub
    env_file:
      - .env
    environment:
      - MQTT_BROKER_URL=tcp://mqtt:1883
    depends_on:
      - mqtt
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
